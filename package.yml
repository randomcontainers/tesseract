name: tesseract
title: Tesseract
summary: Reads printed text in scans and photos (OCR) and writes text, hOCR, ALTO, TSV or searchable PDF. Includes English and orientation and script detection models.
homepage: https://tesseract-ocr.github.io/
license: Apache-2.0
upstream:
  source: github-release
  repository: tesseract-ocr/tesseract
  # Release tags look like 5.5.3; release candidates (5.4.0-rc1) do not match.
  tag-pattern: '^(\d+\.\d+\.\d+)$'
  version-template: '{1}'
  versioning: semver
  version: 5.5.3
  # Releases attach no source tarball, so the build clones the signed tag and
  # checks its signature and commit.
  git:
    url: https://github.com/tesseract-ocr/tesseract.git
    tag: '{version}'
    commit: db0ec62f81b0737fbbe184d8fea40af5738f8eef
  # The English and orientation and script detection models from
  # tessdata_fast, pinned by hand.
  extra-artifacts:
    tessdata-eng:
      version: 4.1.0
      url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/{version}/eng.traineddata
      sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
    tessdata-osd:
      version: 4.1.0
      url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/{version}/osd.traineddata
      sha256: 9cf5d576fcc47564f11265841e5ca839001e7e6f38ff7f7aacf46d15a96b00ff
image:
  entrypoint: [tesseract]
  cmd: [--help]
test:
  - |
    tesseract --version > version.txt
    test "$(head -n 1 version.txt)" = "tesseract $VERSION"
    grep -Eq '^ leptonica-[0-9]+\.[0-9]+' version.txt
    for lib in libgif libjpeg libpng libtiff libwebp; do
      grep -Eq " $lib [0-9]" version.txt || { echo "Leptonica cannot read $lib images" >&2; exit 1; }
    done
    grep -q '^ Found OpenMP ' version.txt
    grep -q '^ Found libarchive ' version.txt
    grep -q '^ Found libcurl/' version.txt
    tesseract --list-langs > langs.txt
    test "$(head -n 1 langs.txt)" = 'List of available languages in "/usr/local/share/tessdata/" (2):'
    grep -Fxq eng langs.txt
    grep -Fxq osd langs.txt
