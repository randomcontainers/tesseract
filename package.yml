    tesseract text.png out txt hocr tsv alto page pdf
    words="$(tr -s '[:space:]' ' ' < out.txt)"
    test "${words% }" = 'Tesseract reads this text from a small PNG image rendered at 300 dpi.'
  - |
    grep -Eq "<span class='ocrx_word' [^>]*>(<[a-z]+>)*Tesseract<" out.hocr
    # The TSV has one row per word at level 5, with the word in column 12.
    awk -F '\t' 'NR == 1 { ok = $12 == "text" } $1 == 5 && $12 == "dpi." { found = 1 } END { exit !(ok && found) }' out.tsv
    grep -q 'CONTENT="Tesseract"' out.xml
    grep -q '<Unicode>Tesseract reads this text' out.page.xml
    test "$(head -c 5 out.pdf)" = %PDF-
    grep -aq '/BaseFont /GlyphLessFont' out.pdf
  - |
    tesseract - - < text.png > stdout.txt
    cmp stdout.txt out.txt
    # Orientation and script detection uses osd.traineddata and the legacy engine.
    tesseract text.png osd --psm 0
    grep -Fxq 'Orientation in degrees: 0' osd.osd
    grep -Fxq 'Script: Latin' osd.osd
    OMP_THREAD_LIMIT=1 tesseract text.png single
    cmp single.txt out.txt
examples:
  - title: Read the text of a scanned page into page.txt
    command: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/randomcontainers/tesseract page.png page
  - title: Make a searchable PDF from a scanned page
    command: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/randomcontainers/tesseract page.png page pdf
  - title: Print the text of an image read from standard input
    command: docker run --rm -i ghcr.io/randomcontainers/tesseract - - < page.png
  - title: Render the pages of a PDF at 300 dpi for OCR (default image)
    command: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" --entrypoint pdftoppm ghcr.io/randomcontainers/tesseract -r 300 -gray -png input.pdf page
combos:
  - with: [poppler]
    default: true
    base: tesseract
    summary: Tesseract with Poppler, for OCR of PDF files. pdftoppm renders the pages and Tesseract reads them.
    test:
      - |
        base64 -d > scan.png <<'EOF'
        iVBORw0KGgoAAAANSUhEUgAAAjQAAACUAQAAAACsc45pAAAACXBIWXMAAC4jAAAuIwF4pT92AAAD
        I0lEQVR42u2Zz27bRhCHv6UWNg8GROSkQ2Nv8wQ65iDYW6DvUb9Cb0RgtHMILN3cN6jfJLRj5Jwn
        aCXlouOq0IEWSG4Poqw/TCQ1EHrahQAtNYOPs7O/mSUo5TnGmEYcZwRO4ARO4ARO4ARO4ARO4ARO
        4ATO93IGm5cj2elxcDzDw+JRsoeTLRxG33CsOSXZHs7pcnK/i1P09sS9Sobbxck/usPSpHy+i6NI
        D034zvy4w5XS+390aEvNg5k+mOmDQVFGMH0wXvF8ap5jyilKxgOAMqKv6CvwEX2zxXk7K7GOzJG5
        EjvzQDaZI5OCyRwouV/kZualwlZY5l6qzXg8OPd7O+cu5y4vekPnBO6KPM1GfzH6Gygune8AuDwr
        0mGRDsnTrLje4CTClzhLbugKXck/MjoDuhnvh586fOrQauc/5VwDjPRQ3aJuYXr7UgfLdf3Bk66M
        xfawvSnuMQLs+TRioBkg4OQGAfRj5CLlIuUYM4w21xX/A9FwlXzRam0zEg0orALIViat0JucEy8x
        WJCF0PIYAWlHkERABhEGwA9iRJNq0nXdLfUs96K+yKpH1NMf8ODrHyvAR4mwLI2sqZ/UAaWtq3/V
        HMaLzK4t0qymz6rBOcmB9w2ZlqZRqNn+PtYswaKBqfbURQFlu75X66U5TH4DuPBfD+LUu2Z9Ad1m
        u5H/VqdPAIVtmMffce54u9FFBVjuR2nBLH2FmPpD0uDotYZ4TpwCiAPlKuWwUC2PnhwpkAKh1+Cc
        k1GtCUuK+j1n9bJtfmktVq9A/fa6PNJbpaftE1sB2RhIC9JcIJFaXpdVUvmk8gnnldniJFdxmes/
        l7tzyeuZwOefX8+YT5g7IP4QL4wXhfHvjH9n5v5mO574MTGJjOuIzp5MkgC/xrzi6g2//AjoxzoZ
        SWz1wOqBpTOwW5wTrjutFi/NNotbgO12FF1NcgK0qFvfmZJISaTE6jV5+W8Pt/iqLhqWvvf9Tdf9
        54452nOUOQrHVceJJy2Ow5lP7AEcvdfjyvijxNNtHfZcRPjfIXACJ3ACJ3ACJ3ACJ3ACJ3ACJ3AC
        J3ACB/gXQ5Ra1Z4yMMYAAAAASUVORK5CYII=
        EOF
        # Tesseract writes the scan as a PDF page with an invisible text layer,
        # which Poppler reads back.
        tesseract scan.png scan pdf
        pdfinfo scan.pdf > info.txt
        grep -Eq '^Pages: +1$' info.txt
        pdffonts scan.pdf > fonts.txt
        grep -q GlyphLessFont fonts.txt
        pdftotext scan.pdf - | tr -s '[:space:]' ' ' | grep -Fq 'Scanned page for Poppler'
      - |
        # OCR of a two-page PDF: pdftoppm renders each page, and Tesseract reads
        # the list of page images into one searchable PDF.
        printf '%s\n' scan.png scan.png > scans.txt
        tesseract scans.txt input pdf
        pdftoppm -r 300 -gray -png input.pdf page
        ls page-*.png > pages.txt
        test "$(wc -l < pages.txt)" -eq 2
        tesseract pages.txt searchable txt pdf
        test "$(grep -c 'Scanned page for Poppler' searchable.txt)" -eq 2
        pdfinfo searchable.pdf > info.txt
        grep -Eq '^Pages: +2$' info.txt
        pdftotext searchable.pdf searchable-layer.txt
        test "$(tr -s '[:space:]' ' ' < searchable-layer.txt | grep -o 'Scanned page for Poppler' | wc -l)" -eq 2
